// Home Mixer 服务 - 推荐 Feed 流编排主服务
// 替代原始 xai_home_mixer_proto crate
//
// 该协议定义了 Home Mixer 的所有数据结构和 RPC 接口。
// Home Mixer 是推荐系统的编排层入口，负责：
//   1. 接收客户端请求，获取用户特征
//   2. 向 Thunder 和 Phoenix 发起并行召回
//   3. 对候选帖子进行过滤、打分聚合
//   4. 返回最终排序后的 Feed 流

syntax = "proto3";

package home_mixer;

// =============================================================================
// 请求/响应消息体
// =============================================================================

// 曝光布隆过滤器条目 —— 用于高效判断帖子是否已被用户看过
// 客户端维护本地布隆过滤器并在请求中传递条目，避免重复推送
message ImpressionBloomFilterEntry {
  // 布隆过滤器的二进制数据
  bytes data = 1;
  // 过滤器的位数
  int32 num_bits = 2;
  // 哈希函数数量
  int32 num_hash_functions = 3;
}

// 连续请求可直接复用的帖子候选；仅包含重新打分所需的稳定身份字段。
message CachedPost {
  uint64 tweet_id = 1;
  uint64 author_id = 2;
  uint64 retweeted_tweet_id = 3;
  uint64 retweeted_user_id = 4;
  uint64 in_reply_to_tweet_id = 5;
  int32 served_type = 6;
  string tweet_text = 7;
  string quoted_tweet_text = 8;
  repeated int64 filtered_topic_ids = 9;
  repeated int64 unfiltered_topic_ids = 10;
  int32 video_duration_ms = 11;
  int32 quoted_video_duration_ms = 12;
  bool in_network = 13;
  double score = 14;
  string language_code = 15;
  // 被引用帖 ID；缓存命中时用于 ancillary 可见性检查。
  uint64 quoted_tweet_id = 16;
}

// 评分帖子查询请求 —— 客户端发往 Home Mixer 的 Feed 获取请求
message ScoredPostsQuery {
  // 当前查看 Feed 的用户 ID（观察者）
  int64 viewer_id = 1;
  // 客户端应用 ID（iOS/Android/Web 等不同端）
  int32 client_app_id = 2;
  // 请求所在的国家代码（ISO 3166-1 alpha-2，如 "CN", "US"）
  string country_code = 3;
  // 请求所在的语言代码（BCP 47，如 "zh", "en"）
  string language_code = 4;
  // 客户端已看过的帖子 ID 列表
  repeated int64 seen_ids = 5;
  // 服务端已投递过的帖子 ID 列表
  repeated int64 served_ids = 6;
  // 是否仅返回网络内（关注者）帖子
  bool in_network_only = 7;
  // 是否为向下滚动加载更多的请求（翻页）
  bool is_bottom_request = 8;
  // 客户端本地布隆过滤器条目
  repeated ImpressionBloomFilterEntry bloom_filter_entries = 9;
  // 话题页或显式兴趣话题；候选需至少命中一个。
  repeated int64 topic_ids = 10;
  // 用户明确排除的话题。
  repeated int64 excluded_topic_ids = 11;
  // 新用户冷启动话题。
  repeated int64 new_user_topic_ids = 12;
  // 请求是否排除视频候选。
  bool exclude_videos = 13;
  // 主 seen 列表不可用时使用的曝光历史。
  repeated int64 impressed_post_ids = 14;
  // 过去请求时间戳，用于刷新节奏判断。
  repeated int64 past_request_timestamps_ms = 15;
  // 上一次请求缓存的候选；非空时不访问外部召回源。
  repeated CachedPost cached_posts = 16;
  bool is_preview = 17;
  bool is_shadow_traffic = 18;
  bool is_polling = 19;
  string ip_address = 20;
  string user_agent = 21;
  bool enable_phoenix_moe = 22;
}

// 帖子投递类型 —— 标识帖子来自哪个召回通道
enum ServedType {
  SERVED_TYPE_UNSPECIFIED = 0;
  // 来自用户关注网络的帖子（Thunder 召回）
  FOR_YOU_IN_NETWORK = 1;
  // 来自 Phoenix 算法检索的全局召回帖子
  FOR_YOU_PHOENIX_RETRIEVAL = 2;
  FOR_YOU_PHOENIX_RETRIEVAL_MOE = 3;
  FOR_YOU_PHOENIX_TOPICS = 4;
  FOR_YOU_TWEET_MIXER = 5;
  FOR_YOU_CACHED_POST = 6;
  RANKED_FOLLOWING = 7;
}

// 帖子的广告邻接风险；未补全时按不可邻接处理。
// AVOID_ADJACENCY 保留既有 wire 值，并在领域层对应上游 MediumRisk。
enum BrandSafetyVerdict {
  BRAND_SAFETY_VERDICT_UNSPECIFIED = 0;
  SAFE_FOR_ADJACENCY = 1;
  AVOID_ADJACENCY = 2;
  LOW_RISK = 3;
}

// 单条评分帖子 —— 已经过管道打分后的帖子
message ScoredPost {
  // 帖子 ID
  uint64 tweet_id = 1;
  // 帖子作者 ID
  uint64 author_id = 2;
  // 如果是转发帖，原始帖子 ID
  uint64 retweeted_tweet_id = 3;
  // 如果是转发帖，原始帖子作者 ID
  uint64 retweeted_user_id = 4;
  // 被回复帖的 ID
  uint64 in_reply_to_tweet_id = 5;
  // 综合排序得分
  float score = 6;
  // 是否来自关注列表网络内
  bool in_network = 7;
  // 投递类型（来源标记）
  int32 served_type = 8;
  // 最后一次被 Phoenix 打分的时间戳（毫秒）
  uint64 last_scored_timestamp_ms = 9;
  // Phoenix 预测请求 ID（用于链路追踪）
  uint64 prediction_request_id = 10;
  // 对话祖先帖子 ID 列表（用于对话线程还原）
  repeated uint64 ancestors = 11;
  // 帖子相关用户的 screen name 映射（user_id -> screen_name）
  map<uint64, string> screen_names = 12;
  // 可见性过滤原因（如果有内容安全问题）
  optional VisibilityFilteredReason visibility_reason = 13;
  BrandSafetyVerdict brand_safety_verdict = 14;
  // 帖子正文，用于广告混排时的关键词规避检查
  string tweet_text = 15;
}

// 可见性过滤原因 —— 内容安全审核结果
message VisibilityFilteredReason {
  // 过滤类型代码
  int32 reason_code = 1;
  // 可读描述
  string description = 2;
}

// 评分帖子响应
message ScoredPostsResponse {
  // 经过排序的帖子列表
  repeated ScoredPost scored_posts = 1;
}

// 广告品牌安全风险等级 -- 用于 PartitionOrganic 混排时判断广告是否可放在某帖子旁。
enum BrandSafetyRiskLevel {
  BRAND_SAFETY_RISK_LEVEL_UNSPECIFIED = 0;
  BSR_LOW = 1;   // 与 BSR_IAS 一样，需要规避相邻 LowRisk 帖子
  BSR_IAS = 2;
  BSR_MEDIUM = 3; // 上游 blender 不附加 LowRisk 邻接规则
  BSR_HIGH = 4;   // 上游 blender 不附加 LowRisk 邻接规则
}

// 广告只携带稳定身份和期望位置；竞价与展示 payload 属于外部广告合同。
// brand_safety_risk / avoid_handles / avoid_keywords 用于混排时的安全规避。
message Advertisement {
  string ad_id = 1;
  uint32 requested_position = 2;
  BrandSafetyRiskLevel brand_safety_risk = 3;
  repeated int64 avoid_handles = 4;  // 广告主指定的规避账号 ID
  repeated string avoid_keywords = 5; // 广告主指定的规避关键词
}

message WhoToFollowModule {
  string module_id = 1;
  repeated uint64 user_ids = 2;
}

message Prompt {
  string prompt_id = 1;
}

message PushToHomePost {
  string notification_id = 1;
  ScoredPost post = 2;
}

// 最终 Feed 项。非帖子类型独立于 ScoredPost/PostCandidate。
message FeedItem {
  uint32 position = 1;
  oneof item {
    ScoredPost post = 2;
    Advertisement advertisement = 3;
    WhoToFollowModule who_to_follow = 4;
    Prompt prompt = 5;
    PushToHomePost push_to_home = 6;
  }
}

message ForYouFeedResponse {
  repeated FeedItem items = 1;
  string request_id = 2;
}

// Additive wrapper for For You-specific request growth. The existing RPC keeps
// accepting ScoredPostsQuery for source and wire compatibility.
message ForYouFeedQuery {
  ScoredPostsQuery query = 1;
}

// Business feed uses mrpyq ObjectID strings end-to-end and is intentionally
// independent from ScoredPostsQuery/PostCandidate and Snowflake semantics.
message BusinessFeedQuery {
  string viewer_account_id = 1;
  uint32 page_size = 2;
  string network_page_token = 3;
  string fallback_page_token = 4;
  repeated string seen_feed_ids = 5;
}

message BusinessFeedResultItem {
  string feed_id = 1;
  string creator_account_id = 2;
  string creator_member_id = 3;
  double score = 4;
  string source = 5;
  string reason = 6;
  uint32 position = 7;
}

message BusinessFeedResponse {
  string request_id = 1;
  repeated BusinessFeedResultItem items = 2;
  string next_network_page_token = 3;
  string next_fallback_page_token = 4;
}

message PipelineStageDebug {
  uint32 count = 1;
  repeated uint64 tweet_ids = 2;
}

message PipelineDebugInfo {
  string request_id = 1;
  PipelineStageDebug retrieved = 2;
  PipelineStageDebug filtered = 3;
  PipelineStageDebug selected = 4;
}

message DebugScoredPostsResponse {
  ScoredPostsResponse response = 1;
  PipelineDebugInfo debug = 2;
}

// =============================================================================
// gRPC 服务定义
// =============================================================================

// Home Mixer 核心服务 —— 对外暴露的 Feed 流获取接口
service ScoredPostsService {
  // 获取为特定用户排序好的推荐帖子列表
  rpc GetScoredPosts(ScoredPostsQuery) returns (ScoredPostsResponse);
  // Additive debug surface using the same request policy and one pipeline run.
  rpc DebugScoredPosts(ScoredPostsQuery) returns (DebugScoredPostsResponse);
}

// 最终 Feed 服务复用同一查询，但返回帖子和条件启用的非帖子项目。
service ForYouFeedService {
  rpc GetForYouFeed(ScoredPostsQuery) returns (ForYouFeedResponse);
  // Wrapper-based additive method; the original RPC remains unchanged.
  rpc GetForYouFeedV2(ForYouFeedQuery) returns (ForYouFeedResponse);
}

// Independent rules-only vertical slice for mrpyq business feeds.
service BusinessFeedService {
  rpc GetBusinessFeed(BusinessFeedQuery) returns (BusinessFeedResponse);
}
