name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Redis 集成测试（含 cluster fixture）默认 #[ignore]；CI 有 redis-server
      # 但 redis-cli 不一定在 runner 镜像里，先只跑不依赖 CLI 的那部分。
      - name: Install redis for integration tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Redis integration tests (single endpoint)
        run: |
          cargo test -p home-mixer --test redis_feed_state --test redis_uas -- --ignored \
            --skip cluster_routing

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build home-mixer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/home-mixer.Dockerfile
          push: false
          tags: home-mixer:ci
          cache-from: type=gha,scope=home-mixer
          cache-to: type=gha,scope=home-mixer,mode=max
      - name: Build phoenix-gateway image
        uses: docker/build-push-action@v6
        with:
          context: phoenix
          file: deploy/docker/phoenix-gateway.Dockerfile
          push: false
          tags: phoenix-gateway:ci
          cache-from: type=gha,scope=phoenix-gateway
          cache-to: type=gha,scope=phoenix-gateway,mode=max
