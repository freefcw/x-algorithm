name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Redis 集成测试（含 cluster fixture）默认 #[ignore]；CI 有 redis-server
      # 但 redis-cli 不一定在 runner 镜像里，先只跑不依赖 CLI 的那部分。
      - name: Install redis for integration tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Redis integration tests (single endpoint)
        run: |
          cargo test -p home-mixer --test redis_feed_state --test redis_uas -- --ignored \
            --skip cluster_routing

  xrex-contract:
    name: xrex adapter contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Keep this wire contract CPU-only; xrex model/engine tests have separate
      # GPU and checkpoint prerequisites.
      - name: Install adapter contract dependencies
        run: |
          uv venv --python 3.11 phoenix/.venv
          uv pip install --python phoenix/.venv/bin/python \
            pytest numpy ./phoenix/python/common/xai-proto
      - name: Adapter translation contract
        working-directory: phoenix
        run: .venv/bin/python -m pytest tests/test_adapter_contract.py -q
      - name: Home Mixer to adapter to fake xrex ranking RPC
        run: cargo test -p home-mixer --test xrex_adapter_contract -- --ignored

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build home-mixer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/home-mixer.Dockerfile
          push: false
          tags: home-mixer:ci
          cache-from: type=gha,scope=home-mixer
          cache-to: type=gha,scope=home-mixer,mode=max
