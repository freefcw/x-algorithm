# uas-worker 行为序列投影 job
#
# 与 home-mixer 同镜像、不同入口。管理端口 9091（/healthz /readyz /metrics），
# 订阅 Kafka 成功后 /readyz 才 200。stdin 开发模式（无 UAS_KAFKA_BROKERS）
# 不会就绪，k8s 里必须配 Kafka。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uas-worker
  labels:
    app.kubernetes.io/name: uas-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: uas-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uas-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: uas-worker
          # TODO(h201): 填实际镜像仓库（与 home-mixer 同镜像）
          image: home-mixer:dev
          command: [/usr/local/bin/uas-worker]
          env:
            - name: RUST_LOG
              value: info
            # 与 home-mixer 共用同一 Redis（或 UAS_REDIS_URL 指向独立实例）
            - name: HOME_MIXER_REDIS_URL
              value: redis://redis:6379/
            - name: HOME_MIXER_ID_REGISTRY_GRPC_ADDR
              value: http://id-registry:50072
            - name: HOME_MIXER_ID_REGISTRY_ALLOCATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: id-registry-allocation
                  key: token
            - name: UAS_KAFKA_BROKERS
              value: kafka:9092
            - name: UAS_KAFKA_TOPIC
              value: uas-events
            - name: UAS_WORKER_METRICS_PORT
              value: "9091"
          ports:
            - name: admin
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
