# ID Registry：ObjectId ↔ Snowflake 全局身份映射服务。
# 默认使用 Redis 持久化映射（ID_REGISTRY_REDIS_URL 或
# ID_REGISTRY_REDIS_CLUSTER_URLS），并在进程内保留有界二级缓存；本地开发可将
# ID_REGISTRY_REDIS_ENABLED=false 切换到纯内存模式。生产部署保持 Redis 开启，
# 进程本身无状态，因此用 Deployment 而不是 StatefulSet/PVC。
# 读写分离:在线副本开 --allow-allocation 后,显式 Allocate RPC 为真正新对象
# 创建 mapping(调用方带了 snowflake_id 就按原值登记),Resolve RPC 保持只读、
# 未知 ID 返回 404。
apiVersion: v1
kind: Service
metadata:
  name: id-registry
spec:
  selector:
    app.kubernetes.io/name: id-registry
  ports:
    # Keep the legacy HTTP port so existing callers can roll forward first;
    # gRPC uses a new port during the migration window.
    - name: http
      port: 50070
      targetPort: http
    - name: grpc
      port: 50072
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: id-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: id-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: id-registry
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "50070"
        prometheus.io/path: /metrics
    spec:
      # 进程收到 SIGTERM 后优雅停机：停止接受新连接并排空在途请求。
      # 一次批量写最多串行经过约 5～8 个 Redis pipeline（每个默认 500 ms 超时），
      # 排空时间需大于这一预算。
      terminationGracePeriodSeconds: 30
      containers:
        - name: id-registry
          image: home-mixer:dev
          command: ["/usr/local/bin/id-service"]
          # 所有 flag 都有同名环境变量（ID_REGISTRY_GRPC_LISTEN、
          # ID_REGISTRY_HTTP_LISTEN、ID_REGISTRY_WORKER_ID、
          # ID_REGISTRY_REDIS_ENABLED、
          # ID_REGISTRY_ALLOW_ALLOCATION、
          # ID_REGISTRY_MAX_BATCH_SIZE）；旧 ID_REGISTRY_LISTEN/--listen 仍可用于
          # 迁移期间指定 HTTP 端口。这里保留 args 形式便于阅读。
          args:
            - "--grpc-listen=0.0.0.0:50072"
            - "--http-listen=0.0.0.0:50070"
            # 序列计数器在 Redis，多副本共享 worker id 也安全；不同 worker id
            # 只是让分配结果可追溯到副本。
            - "--worker-id=0"
            # 在线副本允许显式 Allocate RPC 为真正新对象创建 mapping；
            # Resolve RPC 保持只读，未知 ID 仍返回 404。Allocate 还必须携带
            # ID_REGISTRY_ALLOCATION_TOKEN 对应的 metadata/header。
            - "--allow-allocation"
          env:
            - name: ID_REGISTRY_REDIS_ENABLED
              value: "true"
            # 单 Redis / 代理 / Sentinel 入口。原生 Redis Cluster 改用
            # ID_REGISTRY_REDIS_CLUSTER_URLS（逗号分隔 seed URL），两者互斥。
            # URL 里的用户名/密码不会出现在启动日志中。
            - name: ID_REGISTRY_REDIS_URL
              value: "redis://redis:6379/"
            - name: ID_REGISTRY_REDIS_KEY_PREFIX
              value: "id-registry:v2"
            - name: ID_REGISTRY_ALLOCATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: id-registry-allocation
                  key: token
            # 单个 Redis pipeline 超时，默认 500 ms；客户端整次请求超时也是 500 ms，
            # 在线副本可按需调低。
            # - name: ID_REGISTRY_REDIS_REQUEST_TIMEOUT_MS
            #   value: "500"
            # 单次批量 id 数上限，超限返回 413；默认 10000。
            # - name: ID_REGISTRY_MAX_BATCH_SIZE
            #   value: "10000"
            - name: RUST_LOG
              value: "info"
            # 日志格式：text（默认）或 json，与 Home Mixer 的 HOME_MIXER_LOG_FORMAT 同构。
            - name: ID_REGISTRY_LOG_FORMAT
              value: "json"
          ports:
            - name: http
              containerPort: 50070
            - name: grpc
              containerPort: 50072
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            # /readyz 只读校验 Redis 可达、mapping version 与 storage schema 元数据，
            # 不写 Redis；失败时摘除副本。/metrics 与业务接口同端口，供 Prometheus 抓取。
            httpGet:
              path: /readyz
              port: http
