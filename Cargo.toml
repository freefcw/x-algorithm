[workspace]
resolver = "2"
members = [
    "proto",                # 协议定义（生成 Rust 桩代码）
    "candidate-pipeline",   # 候选流水线框架
    "thunder",              # 实时帖子内存缓存服务
    "home-mixer",           # Feed 流编排主服务
    "vm-ranker",            # Value Model 重排 + DPP 多样性服务（上游 47c1bcd）
    "id-service",           # ObjectId ↔ Snowflake 全局身份映射
]
# phoenix/ 自带独立 Cargo workspace（上游 47c1bcd 的 Rust serving crates，
# 面向 Linux + CUDA 环境），不并入本 workspace。
exclude = ["phoenix"]
