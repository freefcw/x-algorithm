[package]
name = "home-mixer"
version = "0.1.0"
edition = "2021"
default-run = "home-mixer"

[dependencies]
# 命令行和日志
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"

# 异步运行时
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# gRPC
tonic = { version = "0.12", features = ["gzip", "zstd"] }
tonic-reflection = "0.12"
prost = "0.13"

# HTTP
axum = "0.7"

# 静态初始化
lazy_static = "1.5"

# 内部 workspace 依赖
xai_candidate_pipeline = { path = "../candidate-pipeline" }

# 协议定义（替代原始 xai_home_mixer_proto / xai_recsys_proto / xai_thunder_proto）
x-algorithm-proto = { path = "../proto" }

[[bin]]
name = "home-mixer"
path = "main.rs"

[[bin]]
name = "demo-client"
path = "bin/demo_client.rs"

[lib]
path = "lib.rs"
