[package]
name = "home-mixer"
version = "0.1.0"
edition = "2021"
default-run = "home-mixer"

[dependencies]
# 命令行和日志
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"

# 异步运行时
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Feed state / UAS projection persistence
redis = { version = "0.27.6", features = ["tokio-comp", "connection-manager", "cluster-async"] }
# Only the `uas-worker` Kafka consumer needs librdkafka; keep the C toolchain
# requirement out of the default server build (see the `kafka` feature).
rdkafka = { version = "0.36", features = ["libz", "zstd"], optional = true }

# gRPC
tonic = { version = "0.12", features = ["gzip", "zstd"] }
tonic-reflection = "0.12"
prost = "0.13"

# HTTP（health / readiness / metrics 管理端口）
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Prometheus 指标（与 thunder / vm-ranker 同版本）
prometheus = "0.13"

# 静态初始化
lazy_static = "1.5"

# 冷启动探索
rand = "0.9"
rand_distr = "0.5"

# 内部 workspace 依赖
xai_candidate_pipeline = { path = "../candidate-pipeline" }
id-service = { path = "../id-service" }

# 协议定义（替代原始 xai_home_mixer_proto / xai_recsys_proto / xai_thunder_proto）
x-algorithm-proto = { path = "../proto" }

[dev-dependencies]
# `ServiceExt::oneshot` drives the admin router in tests without a socket.
tower = { version = "0.4", features = ["util"] }
tokio-stream = { version = "0.1", features = ["net"] }

[features]
# Kafka consumption in `uas-worker` and the served-candidates Kafka sink.
# Without it the worker still builds and projects newline-delimited JSON from
# stdin (development only).
kafka = ["dep:rdkafka"]
# `kafka` plus OpenSSL inside librdkafka, linked against the system library.
# Required for `SSL` / `SASL_SSL` security protocols and for SCRAM mechanisms;
# the plain `kafka` feature can only speak PLAINTEXT / SASL_PLAINTEXT. Used by
# the container build (deploy/docker/home-mixer.Dockerfile): the Debian builder
# has libssl-dev + pkg-config, the runtime image libssl3. On macOS the
# librdkafka configure step needs `pkg-config` and
# `PKG_CONFIG_PATH=$(brew --prefix openssl)/lib/pkgconfig` to find OpenSSL.
kafka-ssl = ["kafka", "rdkafka/ssl"]

[[bin]]
name = "home-mixer"
path = "main.rs"

[[bin]]
name = "uas-worker"
path = "bin/uas_worker.rs"

[lib]
path = "lib.rs"
