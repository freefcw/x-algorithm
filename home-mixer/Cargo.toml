[package]
name = "home-mixer"
version = "0.1.0"
edition = "2021"
default-run = "home-mixer"

[dependencies]
# 命令行和日志
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"

# 异步运行时
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Feed state persistence
redis = { version = "0.27.6", features = ["tokio-comp", "connection-manager"] }

# gRPC
tonic = { version = "0.12", features = ["gzip", "zstd"] }
tonic-reflection = "0.12"
prost = "0.13"

# HTTP
axum = "0.7"

# 静态初始化
lazy_static = "1.5"

# 冷启动探索
rand = "0.9"
rand_distr = "0.5"

# ObjectId → int64 派生（xrex / wrapping_mul 分桶）
md5 = "0.7"

# 内部 workspace 依赖
xai_candidate_pipeline = { path = "../candidate-pipeline" }

# 协议定义（替代原始 xai_home_mixer_proto / xai_recsys_proto / xai_thunder_proto）
x-algorithm-proto = { path = "../proto" }

[features]
# Thunder / VM Ranker 仍是 i64/u64 proto。默认开启只为演示链路
# （仅能 round-trip 零填充 ObjectId）。非 demo 装配不会回退到整数 Thunder；
# 真实网内召回走 mrpyq。P3 改 string proto 后删除。
default = ["legacy-int-ids"]
legacy-int-ids = []

[[bin]]
name = "home-mixer"
path = "main.rs"

[[bin]]
name = "demo-client"
path = "bin/demo_client.rs"

[lib]
path = "lib.rs"
